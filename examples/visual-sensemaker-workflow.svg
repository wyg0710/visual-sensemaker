<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">From complex information to a clear visual explanation</title>
  <desc id="desc">A five-stage workflow showing input, structure analysis, visual routing, quality checks, and editable output, followed by example uses.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <linearGradient id="header-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#F8FAFC"/>
  <g id="header">
    <rect x="48" y="40" width="1104" height="142" rx="28" fill="url(#header-gradient)"/>
    <text x="88" y="100" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">Visual Sensemaker</text>
    <text x="88" y="142" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#DBEAFE">Turn complex information into a clear, accurate, editable visual.</text>
    <g transform="translate(982 70)">
      <circle cx="44" cy="44" r="44" fill="#FFFFFF" fill-opacity="0.18"/>
      <path d="M22 51 L37 35 L49 47 L66 28" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="22" cy="51" r="4" fill="#FFFFFF"/>
      <circle cx="37" cy="35" r="4" fill="#FFFFFF"/>
      <circle cx="49" cy="47" r="4" fill="#FFFFFF"/>
      <circle cx="66" cy="28" r="4" fill="#FFFFFF"/>
    </g>
  </g>

  <g id="workflow" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="48" y="235" font-size="22" font-weight="700" fill="#0F172A">One reliable path from source to shareable artifact</text>

    <g id="connectors" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)">
      <path d="M252 352 H277"/>
      <path d="M468 352 H493"/>
      <path d="M684 352 H709"/>
      <path d="M900 352 H925"/>
    </g>

    <g id="input-card" filter="url(#shadow)">
      <rect x="48" y="270" width="204" height="164" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="84" cy="308" r="19" fill="#DBEAFE"/>
      <text x="84" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#1D4ED8">1</text>
      <text x="112" y="315" font-size="19" font-weight="700" fill="#0F172A">Input</text>
      <text x="72" y="356" font-size="15" fill="#475569">Text · notes · tables</text>
      <text x="72" y="382" font-size="15" fill="#475569">documents · data</text>
      <text x="72" y="410" font-size="14" font-weight="600" fill="#2563EB">Preserve source meaning</text>
    </g>

    <g id="structure-card" filter="url(#shadow)">
      <rect x="264" y="270" width="204" height="164" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="300" cy="308" r="19" fill="#EDE9FE"/>
      <text x="300" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#6D28D9">2</text>
      <text x="328" y="315" font-size="19" font-weight="700" fill="#0F172A">Structure</text>
      <text x="288" y="356" font-size="15" fill="#475569">Sequence · hierarchy</text>
      <text x="288" y="382" font-size="15" fill="#475569">comparison · quantity</text>
      <text x="288" y="410" font-size="14" font-weight="600" fill="#7C3AED">Find the relationship</text>
    </g>

    <g id="routing-card" filter="url(#shadow)">
      <rect x="480" y="270" width="204" height="164" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="516" cy="308" r="19" fill="#CCFBF1"/>
      <text x="516" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#0F766E">3</text>
      <text x="544" y="315" font-size="19" font-weight="700" fill="#0F172A">Visual route</text>
      <text x="504" y="356" font-size="15" fill="#475569">Flow · timeline · map</text>
      <text x="504" y="382" font-size="15" fill="#475569">comparison · chart</text>
      <text x="504" y="410" font-size="14" font-weight="600" fill="#0F766E">Choose, do not guess</text>
    </g>

    <g id="quality-card" filter="url(#shadow)">
      <rect x="696" y="270" width="204" height="164" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="732" cy="308" r="19" fill="#FEF3C7"/>
      <text x="732" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#B45309">4</text>
      <text x="760" y="315" font-size="19" font-weight="700" fill="#0F172A">Quality</text>
      <text x="720" y="356" font-size="15" fill="#475569">Accuracy · hierarchy</text>
      <text x="720" y="382" font-size="15" fill="#475569">contrast · portability</text>
      <text x="720" y="410" font-size="14" font-weight="600" fill="#B45309">Render and inspect</text>
    </g>

    <g id="output-card" filter="url(#shadow)">
      <rect x="912" y="270" width="240" height="164" rx="20" fill="#0F172A" stroke="#0F172A"/>
      <circle cx="948" cy="308" r="19" fill="#DCFCE7"/>
      <text x="948" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#15803D">5</text>
      <text x="976" y="315" font-size="19" font-weight="700" fill="#FFFFFF">Deliver</text>
      <text x="936" y="356" font-size="15" fill="#CBD5E1">Editable SVG or HTML</text>
      <text x="936" y="382" font-size="15" fill="#CBD5E1">plus a rendered preview</text>
      <text x="936" y="410" font-size="14" font-weight="600" fill="#86EFAC">Clear and reusable</text>
    </g>
  </g>

  <g id="use-cases" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="48" y="500" font-size="22" font-weight="700" fill="#0F172A">Useful wherever information needs structure</text>
    <g transform="translate(48 532)">
      <rect width="258" height="158" rx="20" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="24" y="42" font-size="18" font-weight="700" fill="#1E3A8A">Learn</text>
      <text x="24" y="76" font-size="15" fill="#334155">Study maps, concept explainers,</text>
      <text x="24" y="102" font-size="15" fill="#334155">timelines, and revision sheets</text>
      <rect x="24" y="124" width="82" height="6" rx="3" fill="#2563EB"/>
    </g>
    <g transform="translate(330 532)">
      <rect width="258" height="158" rx="20" fill="#F5F3FF" stroke="#DDD6FE"/>
      <text x="24" y="42" font-size="18" font-weight="700" fill="#4C1D95">Explain</text>
      <text x="24" y="76" font-size="15" fill="#334155">Processes, systems, decisions,</text>
      <text x="24" y="102" font-size="15" fill="#334155">and relationships at a glance</text>
      <rect x="24" y="124" width="82" height="6" rx="3" fill="#7C3AED"/>
    </g>
    <g transform="translate(612 532)">
      <rect width="258" height="158" rx="20" fill="#F0FDFA" stroke="#99F6E4"/>
      <text x="24" y="42" font-size="18" font-weight="700" fill="#134E4A">Compare</text>
      <text x="24" y="76" font-size="15" fill="#334155">Options, features, trade-offs,</text>
      <text x="24" y="102" font-size="15" fill="#334155">and quantitative patterns</text>
      <rect x="24" y="124" width="82" height="6" rx="3" fill="#0F766E"/>
    </g>
    <g transform="translate(894 532)">
      <rect width="258" height="158" rx="20" fill="#FFF7ED" stroke="#FED7AA"/>
      <text x="24" y="42" font-size="18" font-weight="700" fill="#7C2D12">Share</text>
      <text x="24" y="76" font-size="15" fill="#334155">Reports, presentations, social</text>
      <text x="24" y="102" font-size="15" fill="#334155">posts, and printable handouts</text>
      <rect x="24" y="124" width="82" height="6" rx="3" fill="#EA580C"/>
    </g>
  </g>

  <text x="48" y="752" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#64748B">Accuracy first · Editable by default · Accessible by design</text>
</svg>
