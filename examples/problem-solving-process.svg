<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="process-title process-desc">
  <title id="process-title">从发现问题到复盘：六步行动流程</title>
  <desc id="process-desc">一张从左到右阅读的六步流程图，依次为发现问题、收集资料、分析原因、制定方案、执行和复盘。</desc>

  <defs>
    <linearGradient id="header-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="flow-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#F8FAFC"/>

  <g id="heading">
    <rect x="56" y="56" width="1088" height="144" rx="28" fill="url(#header-gradient)"/>
    <text x="96" y="116" fill="#FFFFFF" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700">从发现问题到复盘</text>
    <text x="96" y="158" fill="#E0E7FF" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400">六个连续步骤，将思考转化为行动</text>
    <g transform="translate(1036 92)" aria-hidden="true">
      <circle cx="32" cy="32" r="32" fill="#FFFFFF" fill-opacity="0.16"/>
      <path d="M16 38 L27 27 L36 34 L50 19" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g id="connectors" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" marker-end="url(#flow-arrow)" aria-hidden="true">
    <path d="M220 420 H242"/>
    <path d="M400 420 H422"/>
    <path d="M580 420 H602"/>
    <path d="M760 420 H782"/>
    <path d="M940 420 H962"/>
  </g>

  <g id="steps" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif">
    <g id="step-1" transform="translate(60 316)" filter="url(#card-shadow)">
      <rect width="160" height="208" rx="22" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
      <circle cx="80" cy="52" r="26" fill="#DBEAFE"/>
      <text x="80" y="60" text-anchor="middle" fill="#1D4ED8" font-size="22" font-weight="700">01</text>
      <text x="80" y="126" text-anchor="middle" fill="#0F172A" font-size="23" font-weight="700">发现问题</text>
      <text x="80" y="166" text-anchor="middle" fill="#64748B" font-size="15">第 1 步</text>
    </g>

    <g id="step-2" transform="translate(240 316)" filter="url(#card-shadow)">
      <rect width="160" height="208" rx="22" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
      <circle cx="80" cy="52" r="26" fill="#EDE9FE"/>
      <text x="80" y="60" text-anchor="middle" fill="#6D28D9" font-size="22" font-weight="700">02</text>
      <text x="80" y="126" text-anchor="middle" fill="#0F172A" font-size="23" font-weight="700">收集资料</text>
      <text x="80" y="166" text-anchor="middle" fill="#64748B" font-size="15">第 2 步</text>
    </g>

    <g id="step-3" transform="translate(420 316)" filter="url(#card-shadow)">
      <rect width="160" height="208" rx="22" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/>
      <circle cx="80" cy="52" r="26" fill="#CCFBF1"/>
      <text x="80" y="60" text-anchor="middle" fill="#0F766E" font-size="22" font-weight="700">03</text>
      <text x="80" y="126" text-anchor="middle" fill="#0F172A" font-size="23" font-weight="700">分析原因</text>
      <text x="80" y="166" text-anchor="middle" fill="#64748B" font-size="15">第 3 步</text>
    </g>

    <g id="step-4" transform="translate(600 316)" filter="url(#card-shadow)">
      <rect width="160" height="208" rx="22" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2"/>
      <circle cx="80" cy="52" r="26" fill="#FEF3C7"/>
      <text x="80" y="60" text-anchor="middle" fill="#A16207" font-size="22" font-weight="700">04</text>
      <text x="80" y="126" text-anchor="middle" fill="#0F172A" font-size="23" font-weight="700">制定方案</text>
      <text x="80" y="166" text-anchor="middle" fill="#64748B" font-size="15">第 4 步</text>
    </g>

    <g id="step-5" transform="translate(780 316)" filter="url(#card-shadow)">
      <rect width="160" height="208" rx="22" fill="#FFFFFF" stroke="#FED7AA" stroke-width="2"/>
      <circle cx="80" cy="52" r="26" fill="#FFEDD5"/>
      <text x="80" y="60" text-anchor="middle" fill="#C2410C" font-size="22" font-weight="700">05</text>
      <text x="80" y="126" text-anchor="middle" fill="#0F172A" font-size="23" font-weight="700">执行</text>
      <text x="80" y="166" text-anchor="middle" fill="#64748B" font-size="15">第 5 步</text>
    </g>

    <g id="step-6" transform="translate(960 316)" filter="url(#card-shadow)">
      <rect width="160" height="208" rx="22" fill="#0F172A" stroke="#0F172A" stroke-width="2"/>
      <circle cx="80" cy="52" r="26" fill="#DCFCE7"/>
      <text x="80" y="60" text-anchor="middle" fill="#15803D" font-size="22" font-weight="700">06</text>
      <text x="80" y="126" text-anchor="middle" fill="#FFFFFF" font-size="23" font-weight="700">复盘</text>
      <text x="80" y="166" text-anchor="middle" fill="#CBD5E1" font-size="15">第 6 步</text>
    </g>
  </g>

  <g id="reading-note" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif">
    <line x1="60" y1="608" x2="1140" y2="608" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="76" cy="660" r="8" fill="#2563EB"/>
    <text x="98" y="667" fill="#475569" font-size="18">阅读方向：从左到右</text>
    <text x="1140" y="667" text-anchor="end" fill="#64748B" font-size="16">顺序由编号、位置与箭头共同表达</text>
  </g>
</svg>
